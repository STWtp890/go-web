Name: "${APP_NAME}"
Host: "0.0.0.0"
Port: 8888

Prometheus:
  Host: 0.0.0.0
  Port: 9101
  Path: /metrics

Auth:
  AccessSecret: "${AUTH_ACCESS_SECRET}"
  AccessExpire: 86400 # Access Token 有效期：24 小时
Refresh:
  AccessSecret: "${REFRESH_ACCESS_SECRET}"
  AccessExpire: 604800 # Refresh Token 有效期：7 天

SqlxConf:
  DataSource: "${DB_USER}:${DB_PASSWORD}@tcp(${DB_HOST}:${DB_PORT})/${DB_NAME}?${DB_PARAMS}"
  DriverName: "${DB_DRIVER}" # [Options: mysql | postgres | sqlite3]
  Policy: "${DB_POLICY}" # [Options: round-robin(default) | random]

CacheConf:
  - Host: "${CACHE_REDIS_HOST}:${CACHE_REDIS_PORT}"
    Type: "${CACHE_REDIS_TYPE}" # [Options: node(default) | cluster]
    User: "${CACHE_REDIS_USER}"
    Pass: "${CACHE_REDIS_PASSWORD}"

RedisConf:
  Host: "${REDIS_HOST}:${REDIS_PORT}"
  Type: "${REDIS_TYPE}" # [Options: node(default) | cluster]
  User: "${REDIS_USER}"
  Pass: "${REDIS_PASSWORD}"

LogConf:
  ServiceName: "${APP_NAME}" # [Optional]
  Mode: ${LOG_MODE} # [Options: console(default) | file | volume]
  Encoding: ${LOG_ENCODING} # [Options: json(default) | plain]
  TimeFormat: ${LOG_TIME_FORMAT} # [Optional]
  Path: "${LOG_PATH}" # [Default: 'logs']
  Level: ${LOG_LEVEL} # [Options: debug | info(default) | error | severe]
  MaxContentLength: ${LOG_MAX_CONTENT_LENGTH} # [Optional]
  Compress: ${LOG_COMPRESS} # [Optional]
  Stat: ${LOG_STAT} # [Default: true]
  KeepDays: ${LOG_KEEP_DAYS} # [Optional]
  StackCooldownMillis: ${LOG_STACK_COOLDOWN_MILLIS} # [Default: 100]
  MaxBackups: ${LOG_MAX_BACKUPS} # [Default: 0]
  MaxSize: ${LOG_MAX_SIZE} # [Default: 0]
  Rotation: ${LOG_ROTATION} # [Options: daily(default), size]
