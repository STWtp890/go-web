name: go-rag-demo

services:
  control-postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: mixin_control
      POSTGRES_USER: mixin_control
      POSTGRES_PASSWORD: mixin_control
    ports:
      - "127.0.0.1:${CONTROL_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mixin_control -d mixin_control"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - control-postgres-data:/var/lib/postgresql

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/6333'"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    volumes:
      - qdrant-data:/qdrant/storage

  pgvector:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - pgvector-data:/var/lib/postgresql

volumes:
  control-postgres-data:
  qdrant-data:
  pgvector-data:
