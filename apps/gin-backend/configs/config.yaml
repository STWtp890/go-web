# Gin 后端应用配置
server:
  port: 8080
  mode: debug          # debug | release | test
  read_timeout: 30s
  write_timeout: 30s

# PostgreSQL 配置 (auth/manager 业务表)
# 账号是 go_web_app：它只被授予认证与管理表，对三个来源专属服务 schema 没有任何权限。
# 该角色由 deployments/postgresql/sql/service/service_roles.sql 建立。
postgres:
  host: 127.0.0.1
  port: 15432
  user: go_web_app
  password: "go_web_app"
  dbname: gin_demo
  max_idle_conns: 10
  max_open_conns: 100

# Redis 配置
redis:
  host: 127.0.0.1
  port: 16379
  password: ""
  db: 0

# ADR-017：正式文档与空间的唯一写入方是 document-service。启用本段后，Web 文档
# 路由整体切到文档服务接口（写命令、详情读取，以及经 capability 的正式文档检索），
# go-web 不再读写文档业务表。未启用时文档路由不注册——刻意不提供"直接写表"的回退。
source_owned_services:
  enabled: false
  document_service_address: 127.0.0.1:18081
  document_search_address: 127.0.0.1:18082
  document_service_audience: document-service
  document_search_audience: document-search
  # 必须等于 document_search_audience：capability 只对签发给它的 audience 有效。
  capability_audience: document-search
  # caller 必须是登记过的、可以声明 web:* 主体的服务身份。
  caller: go-web
  actor: go-web-api
  capability_key_path: ../../deployments/secrets/mixin_search_capability.key
  request_timeout: 10s

custom:
  # JWT 配置 (RS256 非对称加密)
  jwt:
    issuer: "gin-backend"
    private_key_path: "configs/rsa_private.pem"
    public_key_path: "configs/rsa_public.pem"
    access_expire_hours: 24     # Access Token 有效期 (小时)
    refresh_expire_hours: 168   # Refresh Token 有效期 (小时, 7 天)

  # 浏览器 HttpOnly 会话 Cookie。开发环境允许 HTTP；生产务必 secure: true，
  # 并替换 csrf_secret 为部署专用随机值。
  cookie:
    secure: false
    domain: ""
    same_site: lax
    csrf_secret: "development-only-change-before-production"

  # CORS 配置
  cors:
    allow_origins:
      - "http://localhost:5173"
      - "http://localhost:3000"
      - "http://localhost:15173"
    allow_methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    allow_headers:
      - Origin
      - Content-Type
      - X-CSRF-Token
    expose_headers:
      - Content-Length
    allow_credentials: true
    max_age: 12h

  # 上传文件配置
  upload:
    max_size: 10485760    # 10MB
    allow_exts:
      - .jpg
      - .jpeg
      - .png
      - .gif
      - .pdf
    path: storage/uploads

log:
  level: info           # debug | info | warn | error
  format: text          # text | json
  output: stdout        # stdout | file
  file_path: storage/logs/app.log
