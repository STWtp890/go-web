# Docker Compose configuration. The service names resolve through the Compose
# network; production deployments should provide their own configuration,
# JWT key pair and secrets instead.
#
# 本文件服务于本地 Compose：运行在明文 HTTP 上，并使用仓库内示例凭据。
# 因此它声明 mode: debug —— 声明为 release 的配置会被 config.checkReleaseSecrets
# 拒绝（禁止占位 csrf_secret、要求 cookie.secure=true、禁止示例口令）。
server:
  port: 8080
  mode: debug
  read_timeout: 30s
  write_timeout: 30s

postgres:
  host: postgres
  port: 5432
  # The Web account: auth and manager tables only. It has no privilege on the
  # source-owned service schemas, so the database enforces the ADR-017 boundary
  # independently of the code. Created by
  # deployments/postgresql/sql/service/service_roles.sql.
  user: go_web_app
  password: "go_web_app"
  dbname: gin_demo
  max_idle_conns: 10
  max_open_conns: 100

redis:
  host: redis
  port: 6379
  password: ""
  db: 0

# ADR-017 source-owned services. In the Compose stack the Web document routes are
# served by document-service and document-search, so the container never reads or
# writes the document business tables.
source_owned_services:
  enabled: true
  document_service_address: document-service:18081
  document_search_address: document-search:18082
  document_service_audience: document-service
  document_search_audience: document-search
  capability_audience: document-search
  caller: go-web
  actor: go-web-api
  capability_key_path: secrets/mixin_search_capability.key
  request_timeout: 10s

custom:
  jwt:
    issuer: "gin-backend"
    private_key_path: "configs/rsa_private.pem"
    public_key_path: "configs/rsa_public.pem"
    access_expire_hours: 24
    refresh_expire_hours: 168
  # Compose 本地联调配置；生产配置应启用 secure 并提供独立 CSRF 密钥。
  cookie:
    secure: false
    domain: ""
    same_site: lax
    csrf_secret: "development-only-change-before-production"
  cors:
    allow_origins:
      - "http://localhost:15173"
      - "http://localhost:8080"
    allow_methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    allow_headers:
      - Origin
      - Content-Type
      - X-CSRF-Token
    expose_headers:
      - Content-Length
    allow_credentials: true
    max_age: 12h
  upload:
    max_size: 10485760
    allow_exts:
      - .jpg
      - .jpeg
      - .png
      - .gif
      - .pdf
    path: storage/uploads

log:
  level: info
  format: text
  output: stdout
  file_path: storage/logs/app.log
