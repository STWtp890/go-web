# Docker Compose configuration. The service names resolve through the Compose
# network; production deployments should provide their own configuration and
# JWT key pair instead.
server:
  port: 8080
  mode: release
  read_timeout: 30s
  write_timeout: 30s

postgres:
  host: postgres
  port: 5432
  user: postgres
  password: "postgres"
  dbname: gin_demo
  max_idle_conns: 10
  max_open_conns: 100

redis:
  host: redis
  port: 6379
  password: ""
  db: 0

custom:
  jwt:
    issuer: "gin-backend"
    private_key_path: "configs/rsa_private.pem"
    public_key_path: "configs/rsa_public.pem"
    access_expire_hours: 24
    refresh_expire_hours: 168
  # Compose 本地联调配置；生产配置应启用 secure 并提供独立 CSRF 密钥。
  cookie:
    secure: false
    domain: ""
    same_site: lax
    csrf_secret: "development-only-change-before-production"
  cors:
    allow_origins:
      - "http://localhost:15173"
      - "http://localhost:8080"
    allow_methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    allow_headers:
      - Origin
      - Content-Type
      - X-CSRF-Token
    expose_headers:
      - Content-Length
    allow_credentials: true
    max_age: 12h
  upload:
    max_size: 10485760
    allow_exts:
      - .jpg
      - .jpeg
      - .png
      - .gif
      - .pdf
    path: storage/uploads

log:
  level: info
  format: text
  output: stdout
  file_path: storage/logs/app.log
