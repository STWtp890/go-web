name: verify

# 仓库原先没有任何 CI，投入最大的资产（依赖边界、proto 生成物一致性、
# 95 项运行时 API 断言）全靠人工记得执行。本流水线覆盖 module 测试、协议生成物、
# 前端构建和仓库卫生；来源服务集成测试使用一次性 PostgreSQL 与 Qdrant 服务容器。
#
# document-search 的向量流程默认启用：它启动即要求 Qdrant，集成测试连不上就
# Fatal 而不是跳过，因此 Qdrant 是本作业的必需依赖而不是可选加速项。Qdrant 镜像
# 没有 shell，无法用 --health-cmd 探活，就绪由下面的等待步骤显式轮询。
#
# 不在本流水线内：deployments/verify.ps1 的跨服务端到端验收——它需要构建镜像、
# 启动完整栈与空数据卷，属于里程碑/行级改动的门禁，按需手工执行。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.8'
  # 与 packages/gen 中已提交生成物一致，改动前请同步更新并重新生成。
  PROTOC_VERSION: '33.4'
  PROTOC_GEN_GO_VERSION: 'v1.36.11'
  PROTOC_GEN_GO_GRPC_VERSION: 'v1.6.2'

jobs:
  go-modules:
    name: go build / vet / test（逐 module，GOWORK=off）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: gin_demo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gin_demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # Qdrant serves the document-search vector flow. Its image ships no shell,
      # so a container health command cannot be expressed here; the job waits for
      # /readyz in a step instead.
      #
      # The host port is 16334, not 6334: the service's own default configuration
      # (and therefore every integration test, which builds on config.Default())
      # dials 127.0.0.1:16334. Publishing the container port unchanged would leave
      # the tests connecting to nothing, and no environment variable would help -
      # the tests take the default rather than the environment.
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
          - 16334:6334
    # GOWORK=off 是刻意的：只 cd 到子目录仍会向上发现根 go.work，
    # 那样无法证明 module 自洽（曾实测 GOWORK=off 下两个应用均构建失败）。
    # 两个应用现已在 go.mod 中显式 require + replace packages/gen。
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Qdrant to become ready
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:6333/readyz >/dev/null 2>&1; then
              echo "qdrant ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Qdrant did not answer /readyz on 127.0.0.1:6333 within 120s"
          exit 1

      - name: Initialize PostgreSQL for source-service integration tests
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d gin_demo < deployments/postgresql/sql/plugin/trigram_setup.sql
          # The Web account tables come first: service_roles.sql grants go_web_app
          # rights on them, and a grant on a missing relation aborts the file.
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d gin_demo < deployments/postgresql/sql/service/auth/schema_init.sql
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d gin_demo < deployments/postgresql/sql/service/manager/schema_init.sql
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d gin_demo < apps/document-service/schema/schema_init.sql
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d gin_demo < apps/document-search/schema/schema_init.sql
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d gin_demo < apps/qq-search/schema/schema_init.sql
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d gin_demo < deployments/postgresql/sql/service/service_roles.sql
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d gin_demo < deployments/postgresql/sql/service/verify_service_isolation.sql

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            apps/gin-backend/go.sum
            apps/mixin-search/go.sum
            apps/document-service/go.sum
            apps/document-search/go.sum
            apps/qq-search/go.sum
            packages/gen/go.sum
            packages/serviceauth/go.sum

      # go.work 不把 ./... 传递到各 module，必须逐目录执行。
      - name: Build, vet and test
        run: |
          set -euo pipefail
          for module in \
            apps/document-service \
            apps/document-search \
            apps/qq-search \
            apps/gin-backend \
            apps/mixin-search \
            packages/gen \
            packages/serviceauth
          do
            echo "::group::$module"
            (
              cd "$module"
              go build ./...
              go vet ./...
              go test ./...
            )
            echo "::endgroup::"
          done

      # The source-owned services must exercise their real dependencies. A suite
      # that silently skipped would leave the vector flow, the event consumer and
      # the scope filters unproven while the job stayed green, so the skip count
      # is asserted rather than assumed.
      - name: Assert the source-owned integration tests ran with no skips
        run: |
          set -euo pipefail
          for module in apps/document-service apps/document-search apps/qq-search; do
            log="$(mktemp)"
            echo "::group::$module integration"
            (
              cd "$module"
              go test ./... -count=1 -run Integration -v 2>&1 | tee "$log"
            )
            echo "::endgroup::"
            if grep -qE '^[[:space:]]*--- SKIP' "$log"; then
              echo "::error::$module skipped an integration test; these tests must fail without their dependencies, not skip"
              exit 1
            fi
            if ! grep -qE '^--- PASS|^ok[[:space:]]' "$log"; then
              echo "::error::$module reported no passing integration test"
              exit 1
            fi
            rm -f "$log"
          done
          echo "OK: every source-owned integration suite ran with no skips"

      # mixin-search 的依赖边界由 Go 测试强制，单独列出以便失败时定位。
      - name: Architecture boundary (mixin-search)
        run: |
          set -euo pipefail
          cd apps/mixin-search
          go test ./internal/architecture -v

  generated-proto:
    name: proto 生成物与源文件一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: packages/gen/go.sum

      - uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Go protobuf plugins (pinned)
        run: |
          set -euo pipefail
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@${{ env.PROTOC_GEN_GO_VERSION }}"
          go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@${{ env.PROTOC_GEN_GO_GRPC_VERSION }}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Regenerate and compare all six protocol contracts
        shell: pwsh
        run: ./packages/proto/verify-generated.ps1

  frontend:
    name: 前端 type-check 与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/simple-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/simple-frontend/package-lock.json

      - run: npm ci

      # build 脚本链：阶段边界校验 → vue-tsc → vite build
      - run: npm run build

  hygiene:
    name: 仓库卫生
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整历史才能对提交区间执行 diff。
          fetch-depth: 0

      # 注意：在干净检出上直接跑 `git diff --check` 比较的是工作树与索引，
      # 恒为空——那是一个假通过的判据。必须指定提交区间。
      - name: git diff --check over the pushed range
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          # 首次推送、或事件未提供可用的 before 时，回退到根提交。
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            base="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi
          echo "checking whitespace errors in ${base}..HEAD"
          git diff --check "${base}" HEAD

      # 阶段报告曾引用 deployments/test-results 的运行产物，而该目录按保留策略滚动
      # 清理，导致 23 处证据链接失效。现在由脚本强制：正式文档只能链接到
      # docs/reports/evidence/ 下的不可变归档快照。
      - name: Check documentation links
        shell: pwsh
        run: ./docs/check-doc-links.ps1

      # 密钥绝不应出现在受版本控制的文件中（生成物由卷挂载提供）。
      - name: Assert no committed key material
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '\.(pem|key)$'; then
            echo "::error::检测到受版本控制的密钥文件；密钥应由挂载提供，不入库。"
            exit 1
          fi
          echo "OK: no tracked .pem/.key files"

      # Windows PowerShell 5.1 把无 BOM 的 .ps1 按 ANSI 解析：多字节注释的尾字节
      # 可能吞掉紧随的换行，使下一行代码并入注释而静默失效。仓库约定 .ps1 保持 ASCII-only。
      - name: Assert PowerShell scripts are ASCII-only
        run: |
          set -euo pipefail
          offenders="$(grep -rlP '[^\x00-\x7F]' --include='*.ps1' . || true)"
          if [[ -n "$offenders" ]]; then
            echo "$offenders"
            echo "::error::检测到含非 ASCII 的 .ps1；Windows PowerShell 5.1 会误解析，请改为 ASCII 或加 UTF-8 BOM。"
            exit 1
          fi
          echo "OK: all .ps1 files are ASCII-only"
