# Run the complete local stack with:
#   docker compose -f docker-compose.yaml up -d --build --wait
services:
  postgres:
    build:
      context: ./deployments/postgresql
      dockerfile: Dockerfile
    image: gin-postgres:local
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gin_demo
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb,pg_search"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deployments/postgresql/sql:/sql:ro
      # The whole deployments/postgresql tree is mounted read-only so the
      # bootstrap script can read the shared SQL; the per-service baselines are
      # mounted separately below because a read-only parent mount cannot host new
      # mount points inside it.
      - ./deployments/postgresql:/database:ro
      - ./deployments/postgresql/entryscript:/docker-entrypoint-initdb.d:ro
      # Each source-owned service keeps its schema baseline inside its own module
      # so the service owns its storage definition; the bootstrap below only
      # applies them, it does not own them.
      - ./apps/document-service/schema:/service-schema/document-service:ro
      - ./apps/document-search/schema:/service-schema/document-search:ro
      - ./apps/qq-search/schema:/service-schema/qq-search:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gin_demo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redisdata:/data
      - ./deployments/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Legacy retrieval baseline. It is NOT part of the default startup path: the
  # Web document surface reaches document-service and document-search, so nothing
  # in the running product needs this service. It stays reachable behind a
  # profile because apps/mixin-search still owns the migration-period retrieval
  # implementation that ADR-017 stage B took over, and its own verification
  # scripts prove that implementation.
  #
  #   docker compose --profile legacy-retrieval up -d mixin-search control-postgres
  control-postgres:
    image: postgres:17-bookworm
    profiles: ["legacy-retrieval"]
    ports:
      # 只绑定回环，供容量测量与门禁直接读取控制状态（服务本身走容器网络）。
      - "127.0.0.1:${CONTROL_POSTGRES_PORT:-15433}:5432"
    environment:
      POSTGRES_DB: mixin_control
      POSTGRES_USER: mixin_control
      POSTGRES_PASSWORD: mixin_control
    volumes:
      - control-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mixin_control -d mixin_control"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      # 只绑定回环，供容器门禁直接断言 alias 映射（qdrant 镜像内没有 curl，
      # 端口默认不发布；服务本身通过容器网络访问 6334）。
      - "127.0.0.1:${QDRANT_GRPC_PORT:-16334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  mixin-search:
    profiles: ["legacy-retrieval"]
    build:
      context: .
      dockerfile: apps/mixin-search/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    image: mixin-search:local
    command:
      - /app/rag-server
      - -grpc-address=0.0.0.0:9090
      - -store=qdrant
      - -qdrant-host=qdrant
      - -qdrant-port=6334
      - -qdrant-collection=go_web_shadow_v1
      - -control-store=postgres
      - -control-dsn=postgres://mixin_control:mixin_control@control-postgres:5432/mixin_control?sslmode=disable
      - -control-namespace=go-web-shadow-v1
      - -control-bootstrap=true
      # 聊天语料：独立 collection、独立控制 namespace、独立 reconciler。集合名必须与
      # 文档集合不同，服务端启动时会校验，共享集合会被拒绝启动。
      - -chat-enabled=${MIXIN_SEARCH_CHAT_ENABLED:-true}
      - -chat-collection=go_web_chat_v1
      - -chat-control-namespace=chat-v1
      # 容量与账本保留（A 档，2026-09-19 拍板并验证生效）。语义是
      #   有效容量 = min(30,000 条消息, 24 MiB 快照)
      #   账本保留 = min(7 天时间窗口, 30,000 条记录)
      # 定性：max-messages 是"防止异常状态无限增长的第二道保险"，**不是产品容量指标**，
      # 不得被读作"保证能存 30,000 条"；真正约束性的是字节上限（先到达者决定）。
      # 数值来自实测画像（docs/reports/evidence/phase3/p33-chat-capacity-profile_20260919.md）：
      # 30k 合成形态实测 CAS p95 ≈ 0.75 s、23.55 MiB 真实边界 p95 ≈ 0.85 s；真实标识符形态下
      # 24 MiB 约在 29.5k（无 metadata）/ 27k（32 B）/ 26k（64 B）先触发。条数上限按字节预算
      # 推导（单响应 receipt 约 38k 容量，取 30k 留约 20% 余量），不使用 100,000。
      # 2026-09-19 复核确认不下调 max-messages 为 26,000：那只会制造"保证能存 26k"的错觉
      # （26k + 64 B metadata 距 24 MiB 仅约 2% 余量），min() 语义更诚实。
      # 注意：本文件是"系统级本地开发与集成验收基线"，不是生产基线；其他部署必须显式传入
      # 这些参数（运行期默认 0 = 不限）并自行验证。
      - -chat-max-messages=${MIXIN_SEARCH_CHAT_MAX_MESSAGES:-30000}
      - -chat-max-snapshot-bytes=${MIXIN_SEARCH_CHAT_MAX_SNAPSHOT_BYTES:-25165824}
      - -chat-operation-retention=${MIXIN_SEARCH_CHAT_OPERATION_RETENTION:-168h}
      - -chat-operation-max-entries=${MIXIN_SEARCH_CHAT_OPERATION_MAX_ENTRIES:-30000}
      # 每条消息的 metadata 预算（UTF-8 字节）。metadata 存在控制快照里，因此它是容量输入：
      # 实测"真实标识符形态 + 每消息 32 字节 metadata"在 30k 时已达 26.2 MiB，
      # 而"仅真实标识符、无 metadata"就已 24.42 MiB —— 字节上限先于条数上限触发。
      # 这四个值由分解画像推导（见 p33-chat-capacity-profile_20260919.md）。
      - -chat-max-metadata-entries=${MIXIN_SEARCH_CHAT_MAX_METADATA_ENTRIES:-8}
      - -chat-max-metadata-key-bytes=${MIXIN_SEARCH_CHAT_MAX_METADATA_KEY_BYTES:-32}
      - -chat-max-metadata-value-bytes=${MIXIN_SEARCH_CHAT_MAX_METADATA_VALUE_BYTES:-64}
      - -chat-max-metadata-total-bytes=${MIXIN_SEARCH_CHAT_MAX_METADATA_TOTAL_BYTES:-64}

      # 调用方身份：缺少 capability 的调用被拒绝，因此密钥必须挂载。
      - -capability-key-file=/app/secrets/mixin_search_capability.key
      - -capability-issuer=go-web
      # audience 按语料划分：文档用 mixin-search，聊天用 mixin-search-chat。
      # 两个值相同会被服务端拒绝启动（不得让两个语料共用同一 audience）。
      - -capability-audience=${MIXIN_SEARCH_CAPABILITY_AUDIENCE:-mixin-search}
      - -chat-capability-audience=${MIXIN_SEARCH_CHAT_CAPABILITY_AUDIENCE:-mixin-search-chat}
      # reflection 让任何能连上端口者枚举全部 API，只在本地调试时开启。
      - -enable-reflection=false
    ports:
      - "127.0.0.1:${MIXIN_SEARCH_GRPC_PORT:-19090}:9090"
    volumes:
      # 边界密钥由 deployments/bootstrap.ps1 生成，不入镜像（见根 .dockerignore 的 **/*.key）。
      - ./deployments/secrets/mixin_search_capability.key:/app/secrets/mixin_search_capability.key:ro
    depends_on:
      control-postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/rag-healthcheck", "-address", "127.0.0.1:9090", "-timeout", "2s"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  gin-backend:
    build:
      context: .
      dockerfile: apps/gin-backend/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    image: gin-backend:local
    ports:
      # 宿主端口可配置：Windows 的 WSL/Hyper-V 动态保留会把 8080 划进排除区间
      # （netsh int ipv4 show excludedportrange protocol=tcp），此时绑定会被系统拒绝。
      # 容器内端口固定 8080，只有宿主侧可改。
      - "${GIN_BACKEND_PORT:-8080}:8080"
    volumes:
      - ./apps/gin-backend/configs/config.docker.yaml:/app/configs/config.yaml:ro
      # JWT 密钥对不进镜像（见根 .dockerignore 的 **/*.pem），改为只读挂载。
      # 前置：在仓库根执行 `go run ./cmd/tools/pemgenerator` 生成 key pair。
      - ./apps/gin-backend/configs/rsa_private.pem:/app/configs/rsa_private.pem:ro
      - ./apps/gin-backend/configs/rsa_public.pem:/app/configs/rsa_public.pem:ro
      # mixin-search 调用凭证使用同一条边界密钥，同样以只读卷提供。
      - ./deployments/secrets/mixin_search_capability.key:/app/secrets/mixin_search_capability.key:ro
      # ADR-017：调用 document-service 与 document-search 的服务身份断言与资源范围
      # capability 共用同一条边界密钥。
      - ./deployments/secrets/mixin_search_capability.key:/app/secrets/boundary.key:ro
      - backend-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Source-owned document and search services (ADR-017).
  #
  # Each service writes its own PostgreSQL schema with its own role, configured
  # in deployments/postgresql/sql/service/service_roles.sql:
  #   document_service_writer  -> schema document_service
  #   document_search_writer   -> schema document_search (+ read-only on the Outbox)
  #   qq_search_writer         -> schema qq_search
  # The isolation is proven by deployments/postgresql/verify-service-isolation.ps1.
  # ---------------------------------------------------------------------------
  document-service:
    build:
      context: .
      dockerfile: apps/document-service/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    image: document-service:local
    command: ["/app/document-service", "-config", "/app/configs/config.yaml"]
    environment:
      DOCUMENT_SERVICE_POSTGRES_DSN: postgres://document_service_writer:document_service@postgres:5432/gin_demo?sslmode=disable
      DOCUMENT_SERVICE_CAPABILITY_KEY_FILE: /app/secrets/boundary.key
      DOCUMENT_SERVICE_GRPC_LISTEN_ADDRESS: 0.0.0.0:18081
      DOCUMENT_SERVICE_HTTP_LISTEN_ADDRESS: 0.0.0.0:18091
    ports:
      - "127.0.0.1:${DOCUMENT_SERVICE_GRPC_PORT:-18081}:18081"
      - "127.0.0.1:${DOCUMENT_SERVICE_HTTP_PORT:-18091}:18091"
    volumes:
      - ./apps/document-service/configs/config.docker.yaml:/app/configs/config.yaml:ro
      - ./deployments/secrets/mixin_search_capability.key:/app/secrets/boundary.key:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/document-service-healthcheck", "-address", "127.0.0.1:18091"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  document-search:
    build:
      context: .
      dockerfile: apps/document-search/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    image: document-search:local
    command: ["/app/document-search", "-config", "/app/configs/config.yaml"]
    environment:
      DOCUMENT_SEARCH_POSTGRES_DSN: postgres://document_search_writer:document_search@postgres:5432/gin_demo?sslmode=disable
      DOCUMENT_SEARCH_CAPABILITY_KEY_FILE: /app/secrets/boundary.key
      DOCUMENT_SEARCH_SOURCE_CAPABILITY_KEY_FILE: /app/secrets/boundary.key
      DOCUMENT_SEARCH_GRPC_LISTEN_ADDRESS: 0.0.0.0:18082
      DOCUMENT_SEARCH_HTTP_LISTEN_ADDRESS: 0.0.0.0:18092
      DOCUMENT_SEARCH_SOURCE_ENDPOINT: document-service:18081
    ports:
      - "127.0.0.1:${DOCUMENT_SEARCH_GRPC_PORT:-18082}:18082"
      - "127.0.0.1:${DOCUMENT_SEARCH_HTTP_PORT:-18092}:18092"
    volumes:
      - ./apps/document-search/configs/config.docker.yaml:/app/configs/config.yaml:ro
      - ./deployments/secrets/mixin_search_capability.key:/app/secrets/boundary.key:ro
    depends_on:
      postgres:
        condition: service_healthy
      document-service:
        condition: service_healthy
      # The vector index is a hard dependency of this service: it opens the
      # active generation's collection at startup and refuses to start when the
      # collection, alias or vector profile does not match. Waiting for Qdrant
      # here turns a startup race into a normal ordered start.
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/document-search-healthcheck", "-address", "127.0.0.1:18092"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  qq-search:
    build:
      context: .
      dockerfile: apps/qq-search/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    image: qq-search:local
    command: ["/app/qq-search", "-config", "/app/configs/config.yaml"]
    environment:
      QQ_SEARCH_POSTGRES_DSN: postgres://qq_search_writer:qq_search@postgres:5432/gin_demo?sslmode=disable
      QQ_SEARCH_CAPABILITY_KEY_FILE: /app/secrets/boundary.key
      QQ_SEARCH_GRPC_LISTEN_ADDRESS: 0.0.0.0:18083
      QQ_SEARCH_HTTP_LISTEN_ADDRESS: 0.0.0.0:18093
    ports:
      - "127.0.0.1:${QQ_SEARCH_GRPC_PORT:-18083}:18083"
      - "127.0.0.1:${QQ_SEARCH_HTTP_PORT:-18093}:18093"
    volumes:
      - ./apps/qq-search/configs/config.docker.yaml:/app/configs/config.yaml:ro
      - ./deployments/secrets/mixin_search_capability.key:/app/secrets/boundary.key:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/qq-search-healthcheck", "-address", "127.0.0.1:18093"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  simple-frontend:
    build:
      context: ./apps/simple-frontend
      dockerfile: Dockerfile
    image: simple-frontend:local
    ports:
      - "15173:80"
    depends_on:
      gin-backend:
        condition: service_healthy
    healthcheck:
      # This checks Nginx and its same-origin proxy to the healthy backend.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  backend-storage:
  control-postgres-data:
  qdrant-data:
