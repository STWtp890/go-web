map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The default upstream name is intended for a Compose service named
    # "gin-backend".
    # Set VITE_API_BASE_URL during the image build when a different public API
    # origin is required instead of this same-origin proxy.
    location /api/ {
        proxy_pass http://gin-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass http://gin-backend:8080;
    }

    location = /readyz {
        proxy_pass http://gin-backend:8080;
    }

    # Vue Router uses HTML5 history mode, so client-side routes must fall back
    # to the application entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
