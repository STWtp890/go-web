# gin-backend Redis 本地开发配置
#
# Redis 保存 SID 会话、Refresh Token 哈希、实体缓存和会话撤销 Pub/Sub。
# 会话状态不得使用 volatile-lru/allkeys-lru 等淘汰策略，否则会造成用户被动下线。

bind 0.0.0.0
port 6379
# Docker 端口已限制为宿主机 127.0.0.1；开启 protected-mode 会将经 Docker
# 转发进入的本机连接视为非回环并拒绝。本文件仅用于无密码本地开发。
protected-mode no

# 保存会话状态，容器重建或 Redis 重启后可恢复；Pub/Sub 消息本身不持久化。
appendonly yes
appendfsync everysec
dir /data

# 在没有显式容量规划时宁可拒绝写入，也不要静默淘汰会话数据。
maxmemory-policy noeviction

# 禁用危险命令的误操作入口；生产环境仍应通过网络隔离、密码或 ACL 保护。
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
